<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Hits | Beyond The Beat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0714;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #130b22;
            border: 1px solid #2a1a4a;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        p {
            color: #9e95b0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .go-btn {
            background: linear-gradient(135deg, #7b3fe4, #985eff);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            display: inline-block;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(123, 63, 228, 0.4);
        }

        .go-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Latest K-Pop Comebacks</h1>
        <p>Click below to view the live official comeback schedule and latest hits.</p>
        
        <!-- This takes them straight to your given website in a new tab -->
        <a href="https://kpopofficial.com/kpop-comebacks/" target="_blank" rel="noopener noreferrer" class="go-btn">View Comebacks Schedule ↗</a>
        
        <a href="music.html" class="back-link">← Back to Music</a>
    </main>

</body>
</html>
